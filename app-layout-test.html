<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ancient Europe (layout test)</title>
<meta name="robots" content="noindex">
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- ===== LAYOUT TEST: full-screen map + floating info panel =====
     Only layout rules below; colours, fonts and components come unchanged from css/style.css -->
<style>
  :root { --panel-w: min(440px, 40vw); --panel-gap: 16px; }

  html, body { height: 100%; }
  body { padding: 0; overflow: hidden; }

  /* App fills the whole window */
  .app-frame {
    max-width: none; height: 100vh; margin: 0;
    border: 0; border-radius: 0;
    display: flex; flex-direction: column;
  }
  .topbar, .timeline-bar, .topics-label, .topics-row { flex-shrink: 0; }

  /* Map takes all remaining space */
  .main-area { display: block; position: relative; flex: 1 1 auto; height: auto; min-height: 0; }
  .map-area  { position: absolute; inset: 0; border-right: 0; }

  /* Info panel floats on top of the map */
  .info-panel {
    position: absolute; z-index: 2;
    top: var(--panel-gap); right: var(--panel-gap); bottom: var(--panel-gap);
    width: var(--panel-w);
    border: 1px solid var(--stone); border-radius: 14px;
    box-shadow: 0 6px 24px rgba(46,46,43,0.18);
  }

  /* Keep map controls and the note clear of the panel */
  .maplibregl-ctrl-top-right,
  .maplibregl-ctrl-bottom-right { right: calc(var(--panel-w) + 2 * var(--panel-gap)); }
  .map-placeholder-note { right: auto; max-width: calc(100% - var(--panel-w) - 3 * var(--panel-gap)); }

  /* Research essay view scrolls inside the full-height frame */
  .app-frame.essay-mode #essay-view { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
</style>
</head>
<body>

<div class="app-frame" id="app-frame">

  <div class="topbar">
    <div class="topbar-row1">
      <div class="brand">
        <!-- TODO: replace with your final transparent logo asset once ready -->
        <img src="assets/icon_zilverkruid2.PNG" alt="Ancient Europe">
        <span class="brand-word">ANCIENT EUROPE</span>
      </div>
      <span class="badge-unlocked" id="unlock-badge">Unlocked</span>
    </div>
    <div class="topbar-row2">
      <div class="overlay-toggles" id="overlay-toggles"></div>
    </div>
  </div>

  <!-- MAP VIEW -->
  <div class="main-area">
    <div class="map-area">
      <div id="map"></div>
      <div class="map-placeholder-note">All 10 periods now use their real QGIS-derived basemaps (zoom 3-6, prototype resolution).</div>
    </div>

    <div class="info-panel">
      <div class="panel-header">
        <div class="period-title" id="period-title">—</div>
        <div class="period-subtitle" id="period-subtitle">—</div>
      </div>
      <div class="panel-tabs" id="panel-tabs"></div>
      <div class="panel-content" id="panel-content"></div>
    </div>
  </div>

  <div class="timeline-bar">
    <div class="timeline-label">Select a time period</div>
    <div class="timeline-periods" id="timeline-periods"></div>
  </div>

  <div class="topics-label">Research essays</div>
  <div class="topics-row" id="topics-row"></div>

  <!-- RESEARCH ESSAY VIEW (shares the topbar above) -->
  <div id="essay-view">
    <div class="dd-back" id="essay-back">← Back to map</div>
    <div class="dd-article">
      <div class="dd-eyebrow" id="essay-eyebrow">Research essay</div>
      <div class="dd-headline" id="essay-headline">—</div>
      <div class="dd-meta" id="essay-meta"></div>
      <div class="dd-body" id="essay-body"></div>
      <div class="dd-source" id="essay-source"></div>
    </div>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
